name: Prix Cardmarket, nouveautés et publication

on:
  schedule:
    - cron: "17 6 * * *"   # chaque jour vers 7 h (heure de Paris en hiver) : prix du jour
    - cron: "47 5 * * 1"   # chaque lundi vers 6 h 45 : nouvelles séries, cartes et produits scellés
  workflow_dispatch:
    inputs:
      nouveautes:
        description: "Chercher aussi les nouvelles séries et les nouveaux produits scellés"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  nouveautes:
    # le lundi, ou à la demande : nouvelles cartes (base officielle) et nouveaux produits scellés (Cardmarket)
    if: github.event.schedule == '47 5 * * 1' || inputs.nouveautes == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Nouvelles cartes et images
        run: node scripts/import-officiel.mjs
      - name: Nouveaux produits scellés
        run: node scripts/import-scelle.mjs
      - name: Empreintes du scanner (nouvelles cartes)
        run: node scripts/make-scan-index.mjs
      - name: Enregistrer les nouveautés
        run: |
          git config user.name "nightdex-bot"
          git config user.email "nightdex-bot@users.noreply.github.com"
          git add data/ images/
          git diff --cached --quiet || git commit -m "Nouveautés du $(date +%F)"
          git push

  prix:
    needs: [nouveautes]
    if: always() && github.event_name != 'push' && needs.nouveautes.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relevé des prix Cardmarket du jour
        run: node scripts/update-prices.mjs
      - name: Actualités du blog officiel
        run: node scripts/update-news.mjs || echo "Actualités indisponibles aujourd'hui"
      - name: Enregistrer l'historique
        run: |
          git config user.name "nightdex-bot"
          git config user.email "nightdex-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Prix et actualités du $(date +%F)"
          git push

  publier:
    needs: [prix]
    if: always() && (needs.prix.result == 'success' || needs.prix.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
